syntax = "proto3";
package kratos.api;

option go_package = "jieyuc.cn/muxu/studio/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message Token {
    // Base64-encoded 32-byte AES key, injected from the environment.
    string key = 1;
    google.protobuf.Duration ttl = 2;
  }
  Token token = 3;
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string host = 1;
    string user = 2;
    string password = 3;
    string dbname = 4;
    int64 port = 5;
    bool auto_migrate = 6;
    bool debug = 7;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}
